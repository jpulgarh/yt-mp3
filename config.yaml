# ─────────────────────────────────────────────────────────────────
#  CLAUDIA – Configuración global
#  Edita este archivo para personalizar el comportamiento del sistema.
# ─────────────────────────────────────────────────────────────────

system:
  name: "Claudia"
  wake_word: "hey claudia"      # Frase de activación (en minúsculas)
  language: "es"                # es = Español, en = English
  listen_timeout: 12            # Segundos máximos de escucha tras wake word
  active: true                  # true = micrófono activo al arrancar

llm:
  host: "http://localhost:11434" # URL del servidor Ollama (local o red)
  model: "gemma3:4b"            # Modelo Ollama a usar (gemma3:4b, llama3, mistral, etc.)
  temperature: 0.7
  max_tokens: 1024

tts:
  # edge-tts usa el servicio de Microsoft (requiere internet)
  # pyttsx3 funciona completamente offline (calidad más baja)
  provider: "edge-tts"
  voice: "es-ES-ElviraNeural"   # Otras opciones: es-MX-DaliaNeural, es-AR-ElenaNeural
  rate: "+0%"                   # Velocidad: -20% más lento, +20% más rápido
  volume: "+0%"

stt:
  # Modelos: tiny (rápido), base, small, medium (recomendado), large (lento/preciso)
  model: "base"
  language: "es"                # null = detección automática de idioma

audio:
  input_device: null            # null = dispositivo por defecto del sistema
  output_device: null
  sample_rate: 16000
  vad_aggressiveness: 2         # Sensibilidad VAD: 0 (permisivo) - 3 (estricto)

paths:
  music_dir: "/media/musica/"   # Carpeta principal de música
  temp_dir: "/tmp/claudia/"     # Archivos temporales (limpiados automáticamente)

player:
  preferred: "mpg123"           # mpg123, audacious, vlc, cvlc
  options:
    mpg123: ["-q"]
    audacious: ["--enqueue"]
    vlc: ["--intf", "dummy", "--play-and-exit"]
    cvlc: ["--play-and-exit"]

modules:
  youtube_downloader: true
  music_player: true
  system_monitor: true
  english_tutor: true
  teacher: true

privacy:
  # Garantías de privacidad – NO modificar salvo que sepas lo que haces
  save_conversation_logs: false  # NUNCA guardar conversaciones en disco
  save_audio_files: false        # NUNCA guardar audio grabado
  send_audio_external: false     # NUNCA enviar audio a servicios externos
  # Nota: edge-tts envía el TEXTO (no audio) al servicio de Microsoft para síntesis.
  # Si requieres 100% offline usa: tts.provider: pyttsx3
